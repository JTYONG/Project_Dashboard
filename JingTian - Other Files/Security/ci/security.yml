# MyHealthReport — continuous security checks.
#
# This repository is not under version control yet. When it is, copy this file
# to .github/workflows/security.yml (or translate it to your CI of choice).
# The jobs are ordered so that the ones that work today run today, and the
# rest activate by uncommenting once the relevant layer exists.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * *"   # 02:00 Asia/Kuala_Lumpur

permissions:
  contents: read

jobs:
  static:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: DOM sink scan (no dependencies)
        run: node Security/tools/dom-sink-scan.js "Phase i/demo"

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/owasp-top-ten
            p/secrets
            Security/sast/semgrep-mhr.yml

      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: dependency review
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm audit --audit-level=high

